# Virtual Host — XAMPP / Apache
# Copie para C:\xampp\apache\conf\extra\produto-cliente.conf
# e inclua em httpd.conf: Include conf/extra/produto-cliente.conf

<VirtualHost *:80>
    ServerName produto-cliente.local
    DocumentRoot "C:/xampp/htdocs/sistema-produto-cliente/public"

    <Directory "C:/xampp/htdocs/sistema-produto-cliente/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/produto-cliente-error.log"
    CustomLog "logs/produto-cliente-access.log" common
</VirtualHost>

# Adicione em C:\Windows\System32\drivers\etc\hosts:
# 127.0.0.1 produto-cliente.local
#
# Acesse: http://produto-cliente.local/login
