name: sistema-produto-cliente

services:
  app:
    container_name: produto-cliente-app
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      # Na rede Docker o MySQL é o serviço db (3306 interno).
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8080/login') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  db:
    container_name: produto-cliente-db
    image: mysql:8.0
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-produto_cliente}
    command:
      - --default-time-zone=-03:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306" # host → container, só se precisar de cliente MySQL local
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  db_data:
